name: CI

# CI untuk report-fraud (repo #39 — situs statis tanpa build, tanpa
# dependensi produksi). Job: static-checks (html-validate Node 24 +
# gate P0 + integritas data lampiran), advisory-sweep OSV (produksi
# saja — repo ini 0 paket produksi), Playwright e2e terhadap server
# statis lokal, dan smoke folder repo (persis yang di-deploy ke
# Cloudflare Pages).
# Node 24 (engines.node >= 22 dikunci di package.json mengikuti pola #29:
# html-validate 11 crash di Node 20).
# JANGAN `npx playwright install` di VM dev — hanya di CI.
#
# CATATAN LOCKFILE (19 Nov 2026): repo ini BELUM punya package-lock.json.
# `npm install` gagal deterministik di VM dev — sandbox VM menolak tulis
# file oleh proses yang sudah melakukan I/O jaringan (fetch registry lalu
# tulis cache = EPERM; terbukti juga di `npm ci`, curl -o, dan cp).
# Karena itu CI memakai `npm install` (bukan `npm ci`) dan TANPA
# `cache: npm` di setup-node (keduanya butuh lockfile). Lockfile hasil
# instalasi CI diunggah sebagai artifact (job static-checks) supaya bisa
# di-commit belakangan; sampai saat itu, instalasi CI resolve fresh dari
# rentang di package.json. Lihat docs/testing.md § "Batas VM dev".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Pemeriksaan statis: HTML + gate P0 + data ──────────────────────────
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Validasi HTML
        run: npx html-validate index.html

      - name: Gate P0 + integritas data
        run: npm run validate

      - name: Unggah package-lock hasil instalasi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: warn

  # ── Advisory sweep (OSV batch, tanpa auth) ────────────────────────────
  # Pola repo #24–#38: 1 POST ke api.osv.dev/v1/querybatch untuk semua
  # paket produksi. JANGAN ganti ke GitHub Advisory DB API + GITHUB_TOKEN
  # (gagal deterministik 401 di CI orteam — token per-job bermasalah).
  # Repo ini tidak punya dependensi produksi (situs statis) — sweep
  # tetap jalan sebagai bukti dan lolos dengan 0 paket.
  advisory-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: OSV sweep (produksi saja, HIGH/CRITICAL = gagal)
        run: python3 scripts/advisory-sweep.py

  # ── Playwright e2e terhadap server statis lokal ───────────────────────
  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium (hanya di CI — JANGAN di VM dev)
        run: npx playwright install --with-deps chromium

      - name: Jalankan e2e (desktop + mobile)
        run: npx playwright test

  # ── Smoke folder repo ─────────────────────────────────────────────────
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Smoke repo (persis yang di-deploy)
        run: npm run smoke
